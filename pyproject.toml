[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "remember-tracker"
version = "0.1.0"
description = "Standalone research into learned person tracking with bounded memory"
requires-python = ">=3.12"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0",
  "numpy<3", "scipy", "PyYAML", "Pillow", "opencv-python",
  "faster-coco-eval>=1.6.5", "tensorboard",
  "onnx>=1.17", "onnxruntime", "gdown", "pytest"
]

[project.scripts]
remember = "tracker.cli:main"

[project.optional-dependencies]
baseline = ["lap==0.5.12", "cython-bbox==0.1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
