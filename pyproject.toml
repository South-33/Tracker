[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "remember-tracker"
version = "0.1.0"
description = "Small research repo for a one-network person detector and tracker"
requires-python = ">=3.12"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0",
  "numpy<3", "scipy", "PyYAML", "Pillow", "opencv-python",
  "faster-coco-eval>=1.6.5", "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
