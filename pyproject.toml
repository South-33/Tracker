[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "remember-tracker"
version = "0.1.0"
description = "Small research repo for a one-network person detector and tracker"
requires-python = ">=3.12"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0",
  "ultralytics==8.4.166", "trackeval==1.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

